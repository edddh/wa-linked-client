# Example nginx vhost. Replace `your-domain.example` and adjust the backend
# port if you changed it in docker-compose.yml.
#
# Get HTTPS with: sudo certbot --nginx -d your-domain.example --redirect
# (certbot rewrites this file to add the TLS server block automatically)

server {
    listen 80;
    server_name your-domain.example;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
