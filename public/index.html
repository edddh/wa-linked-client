<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WA Client</title>
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#111b21" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Accounts screen -->
    <section id="accounts-screen" class="screen" hidden>
      <header class="top-bar">
        <h1>Account WhatsApp</h1>
        <button id="logout-btn" class="icon-btn" title="Esci">&#9211;</button>
      </header>
      <ul id="account-list" class="chat-list"></ul>
      <button id="add-account-btn" class="add-account-btn">+ Aggiungi account</button>
    </section>

    <div id="new-account-overlay" class="attach-overlay" hidden></div>
    <div id="new-account-modal" class="modal-card" hidden>
      <h2>Nuovo account</h2>
      <p class="modal-subtitle">Dai un nome a questo account WhatsApp (es. lavoro, personale)</p>
      <form id="new-account-form">
        <input id="new-account-name" type="text" placeholder="Nome account" value="Personale" autocomplete="off" maxlength="40" />
        <p id="new-account-error" class="error" hidden></p>
        <div class="modal-actions">
          <button type="button" id="new-account-cancel">Annulla</button>
          <button type="submit" id="new-account-submit">Crea</button>
        </div>
      </form>
    </div>

    <!-- Setup / QR screen -->
    <section id="setup-screen" class="screen" hidden>
      <header class="top-bar">
        <button id="setup-back-btn" class="icon-btn">&larr;</button>
        <h1 id="setup-title">Collega WhatsApp</h1>
      </header>
      <div class="setup-card">
        <p id="setup-status">Verifica in corso...</p>
        <img id="qr-image" alt="QR code" hidden />
        <button id="refresh-qr" hidden>Aggiorna QR</button>
      </div>
    </section>

    <!-- Chat list screen -->
    <section id="chats-screen" class="screen" hidden>
      <header class="top-bar">
        <button id="chats-back-btn" class="icon-btn">&larr;</button>
        <h1 id="chats-title">Chat</h1>
      </header>
      <ul id="chat-list" class="chat-list"></ul>
    </section>

    <!-- Thread screen -->
    <section id="thread-screen" class="screen" hidden>
      <header class="top-bar">
        <button id="back-btn" class="icon-btn">&larr;</button>
        <h1 id="thread-title">Chat</h1>
      </header>
      <div id="messages" class="messages"></div>

      <div id="attach-overlay" class="attach-overlay" hidden></div>
      <div id="attach-menu" class="attach-menu" hidden>
        <button type="button" data-kind="camera">
          <span class="attach-icon attach-icon-camera">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </span>
          <span class="attach-label">Fotocamera</span>
        </button>
        <button type="button" data-kind="gallery">
          <span class="attach-icon attach-icon-gallery">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </span>
          <span class="attach-label">Galleria</span>
        </button>
        <button type="button" data-kind="document">
          <span class="attach-icon attach-icon-document">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          </span>
          <span class="attach-label">Documento</span>
        </button>
      </div>
      <input id="file-input-camera" type="file" accept="image/*" capture="environment" hidden />
      <input id="file-input-gallery" type="file" accept="image/*,video/*" hidden />
      <input
        id="file-input-document"
        type="file"
        accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip,.rar,.json,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/plain,text/csv,application/zip,application/json"
        hidden
      />

      <form id="send-form" class="send-bar">
        <button type="button" id="attach-btn" class="icon-btn" title="Allega file">&#128206;</button>
        <textarea id="text-input" rows="1" placeholder="Scrivi un messaggio" enterkeyhint="send"></textarea>
        <button type="submit">Invia</button>
      </form>
    </section>

    <!-- Attachment preview (image/video/document + caption, before sending) -->
    <section id="preview-screen" class="screen" hidden>
      <header class="top-bar">
        <button id="preview-cancel-btn" class="icon-btn">&times;</button>
        <h1>Anteprima</h1>
      </header>
      <div id="preview-body" class="preview-body"></div>
      <form id="preview-form" class="send-bar">
        <input id="preview-caption" type="text" placeholder="Aggiungi una didascalia" autocomplete="off" />
        <button type="submit">Invia</button>
      </form>
    </section>
  </div>
  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";
    window.pdfjsLib = pdfjsLib;
  </script>
  <script src="/app.js"></script>
</body>
</html>
